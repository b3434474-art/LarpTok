<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LarpTok Stories</title><link rel="stylesheet" href="styles.css"></head><body><header class="topbar"><div class="brand">🎭 LarpTok</div><a class="ghost" href="index.html">← Feed</a></header><main><section class="panel"><p class="eyebrow">STORIES</p><h1>📖 Stories</h1><p class="muted">Share a photo, video, or text that lasts 24 hours.</p><form id="storyForm"><textarea id="storyText" maxlength="500" placeholder="Write a story…"></textarea><input id="storyMedia" type="file" accept="image/*,video/*"><select id="privacy"><option value="everyone">Everyone</option><option value="followers">Followers</option><option value="friends">Friends</option></select><button class="primary">Post story</button></form><p id="status" class="message"></p></section><section class="panel"><h2>👀 Active stories</h2><div id="stories" class="storyGrid"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="stories.js"></script></body></html>
