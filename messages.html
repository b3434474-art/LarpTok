<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LarpTok Messages</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="social.css"></head>
<body><header class="topbar"><div class="brand"><span class="logo">🎭</span>LarpTok</div><a class="ghost" href="index.html">← Feed</a></header><main><section class="panel"><h1>💬 Messages</h1><p class="muted">Private conversations on LarpTok.</p><div id="authNotice"></div><div class="messageLayout"><aside><form id="newConversation"><input id="userSearch" placeholder="Username to message" autocomplete="off"><button class="primary">Start chat</button></form><div id="conversations"></div></aside><section><div id="chatHeader" class="chatHeader">Select a conversation</div><div id="messages" class="messages"></div><form id="sendForm" class="sendForm hidden"><input id="messageInput" maxlength="2000" placeholder="Write a message…"><button class="primary">Send</button></form></section></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="messages.js"></script></body></html>
